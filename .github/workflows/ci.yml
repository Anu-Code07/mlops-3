name: CI Pipeline

on:
  push:
    branches: [docker_ci]

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Train model
      run: python src/train.py

    - name: Build Docker image
      run: docker build -t mlops-assignment-3 .

    - name: Run container
      run: docker run mlops-assignment-3

    - name: DockerHub Login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push to DockerHub
      run: |
        docker tag mlops-assignment-3 ${{ secrets.DOCKER_USERNAME }}/mlops-assignment-3
        docker push ${{ secrets.DOCKER_USERNAME }}/mlops-assignment-3
