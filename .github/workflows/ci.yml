name: CI Pipeline

on:
  push:
    branches: [docker_ci]

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python src/train.py

      - name: Simulate Docker build
        run: python docker_simulator.py build

      - name: Simulate Docker run
        run: python docker_simulator.py run

      - name: Simulate Docker push
        run: python docker_simulator.py push ${{ secrets.DOCKER_USERNAME }}

      - name: Run quantization (optional)
        run: |
          python src/quantize.py
          echo "Quantization completed successfully"
